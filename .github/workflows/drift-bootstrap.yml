name: Resolve storage migration lockfile
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
          pub-cache: true
      - name: Resolve
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee /tmp/resolve.log || { bash tool/ci/annotate_failure.sh analyze /tmp/resolve.log; exit 1; }
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          data = base64.b64encode(gzip.compress(Path('pubspec.lock').read_bytes())).decode()
          for i in range(0, len(data), 3000):
              print(f'::notice title=lockfile part {i // 3000}::{data[i:i+3000]}')
          PY
