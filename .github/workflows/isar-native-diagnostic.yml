name: Legacy Isar native compatibility diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      BELOG_QA_BUILD: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
          pub-cache: true
      - name: Build existing APK and inspect Isar ELF segments
        shell: bash
        run: |
          set -euo pipefail
          printf '{"SUPABASE_URL":"https://example.invalid","SUPABASE_KEY":"ci-placeholder-not-a-secret"}' > env.json
          flutter pub get
          flutter build apk --release --dart-define-from-file=env.json > /tmp/build.log 2>&1 || { bash tool/ci/annotate_failure.sh android /tmp/build.log; exit 1; }
          mkdir /tmp/apk-so
          unzip -q build/app/outputs/flutter-apk/app-release.apk 'lib/*/libisar.so' -d /tmp/apk-so
          READELF="$(find "$ANDROID_HOME/ndk" -type f -path '*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf' | sort -V | tail -1)"
          test -n "$READELF"
          for f in /tmp/apk-so/lib/*/libisar.so; do
            result="$("$READELF" -lW "$f" | grep ' LOAD ')"
            echo "::notice title=Legacy ELF $f::$(echo "$result" | tr '\n' ';')"
          done
