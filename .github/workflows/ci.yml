name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"
  BELOG_QA_BUILD: "true"

jobs:
  agent-contract:
    name: agent-contract / guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate agent contract and workflow guardrails
        run: bash tool/ci/validate_agent_contract.sh
      - name: Test CI guardrails and diagnostic annotations
        run: bash tool/ci/test_ci_scripts.sh
      - name: Test release validation rules
        run: python3 -m unittest discover -s tool/release -p 'test_*.py' -v
      - name: Test 16 KiB ELF validation
        run: python3 -m unittest discover -s tool/ci -p 'test_check*.py' -v
      - name: Check whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

  environment-contract:
    name: config-contract / no bundled secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify environment configuration contract
        run: bash tool/ci/check_env_asset_contract.sh

  format:
    name: format / changed-Dart-format
    runs-on: ubuntu-latest
    permissions:
      # The failure step comments the full formatting diff on the PR so it
      # survives the 4096-byte annotation cap. Nothing else is writable.
      contents: read
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting of changed Dart files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="origin/${{ github.base_ref }}...HEAD"
            mapfile -d '' dart_files < <(git diff --name-only -z --diff-filter=ACMR "$range" -- '*.dart')
          else
            mapfile -d '' dart_files < <(git diff --name-only -z --diff-filter=ACMR HEAD^ HEAD -- '*.dart')
          fi
          if (( ${#dart_files[@]} == 0 )); then
            echo "No Dart files changed; formatting gate is not applicable to this PR."
          else
            printf 'Formatting check: %s\n' "${dart_files[@]}"
            mkdir -p build/reports
            set +e
            dart format --output=none --set-exit-if-changed "${dart_files[@]}" 2>&1 | tee build/reports/format-check.log
            fmt_status=${PIPESTATUS[0]}
            set -e
            if [[ "$fmt_status" -ne 0 ]]; then
              changed_paths="$(grep '^Changed ' build/reports/format-check.log | tr '\n' ',' | sed 's/,$//')"
              echo "files needing formatting: ${changed_paths}"
              # Format the real files in place (this checkout is disposable)
              # and capture the exact diff with git. Formatting copies under
              # /tmp loses the package context and produces a DIFFERENT
              # dialect than the gate, so the copy approach is forbidden.
              dart format "${dart_files[@]}" >/dev/null 2>&1 || true
              git --no-pager diff -- "${dart_files[@]}" > /tmp/fmt_full.diff || true
              git checkout -- .
              # Compact per-file summary for the annotation (bounded).
              awk '
                /^diff --git a\// { file = $3; sub(/^a\//, "", file); print "### " file; next }
                /^(index |--- a\/|\+\+\+ b\/|new file mode|deleted file mode|Binary files)/ { next }
                /^[+-]/ { print }
              ' /tmp/fmt_full.diff | head -c 3600 > /tmp/fmt_summary.txt
              cat /tmp/fmt_summary.txt >> "$GITHUB_STEP_SUMMARY"
              if [[ -s /tmp/fmt_full.diff ]]; then
                {
                  echo "### dart format diff (run ${GITHUB_RUN_ID})"
                  echo
                  echo '```diff'
                  head -c 60000 /tmp/fmt_full.diff
                  echo '```'
                  echo
                  echo "_Automated diagnostic comment from the CI workflow; \`dart format\` output versus the current files._"
                } > /tmp/fmt-comment.md
              fi
              if [[ -s /tmp/fmt_summary.txt ]]; then
                diff_out="$(cat /tmp/fmt_summary.txt)"
              else
                diff_out="files needing formatting: ${changed_paths}"
              fi
              diff_out="${diff_out//'%'/'%25'}"
              diff_out="${diff_out//$'\r'/'%0D'}"
              diff_out="${diff_out//$'\n'/'%0A'}"
              echo "::error title=format failure (${changed_paths})::${diff_out}"
            fi
            exit "$fmt_status"
          fi
      - name: Audit repository-wide formatting drift
        shell: bash
        run: |
          set +e
          mkdir -p build/reports
          dart format --output=none --set-exit-if-changed . > build/reports/repository-wide-format-audit.log 2>&1
          audit_status=$?
          set -e
          if [[ "$audit_status" -ne 0 ]]; then
            echo "::warning::Repository-wide formatting drift exists. This audit is non-blocking until legacy formatting debt is normalized; changed Dart files remain blocking."
          else
            echo "Repository-wide formatting audit passed."
          fi
      - name: Upload repository-wide formatting audit
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: format-audit
          path: build/reports/repository-wide-format-audit.log
          if-no-files-found: warn
          retention-days: 14

      - name: Comment the format diff on the PR when files need formatting
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [[ -f /tmp/fmt-comment.md ]]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/fmt-comment.md
          else
            echo "No format diff was produced; nothing to comment."
          fi

  analyze:
    name: analyze / flutter-analyze
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - name: Prepare CI config fixture (env.json for dart-define injection)
        shell: bash
        run: |
          umask 077
          cat > env.json <<'EOF'
          {
            "API_BASE_URL": "https://example.invalid"
          }
          EOF
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run analyzer and preserve diagnostics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/reports
          set +e
          flutter analyze --fatal-infos --machine 2>&1 | tee build/reports/flutter-analyze.log
          statuses=("${PIPESTATUS[@]}")
          status=${statuses[0]}
          set -e
          if (( status == 0 && statuses[1] != 0 )); then
            status=${statuses[1]}
          fi
          if (( status != 0 )); then
            bash tool/ci/annotate_failure.sh analyze build/reports/flutter-analyze.log
          fi
          exit "$status"
      - name: Upload analyzer diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flutter-analyze-log
          path: build/reports/flutter-analyze.log
          if-no-files-found: warn
          retention-days: 14

  test:
    name: test / flutter-test
    runs-on: ubuntu-latest
    permissions:
      # The failure step comments the log tail on the PR so the crash reason
      # survives GitHub's 4096-byte annotation cap. Nothing else is writable.
      contents: read
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - name: Prepare CI config fixture (env.json for dart-define injection)
        shell: bash
        run: |
          umask 077
          cat > env.json <<'EOF'
          {
            "API_BASE_URL": "https://example.invalid"
          }
          EOF
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run tests and collect coverage
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/reports
          set +e
          flutter test --coverage --concurrency=1 --reporter expanded 2>&1 | tee build/reports/flutter-test.log
          statuses=("${PIPESTATUS[@]}")
          status=${statuses[0]}
          set -e
          if (( status == 0 && statuses[1] != 0 )); then
            status=${statuses[1]}
          fi
          if (( status != 0 )); then
            bash tool/ci/annotate_failure.sh analyze build/reports/flutter-test.log
          fi
          exit "$status"
      - name: Comment the log tail on the PR when tests fail
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          {
            echo "### flutter test log tail (run ${GITHUB_RUN_ID})"
            echo
            echo '```'
            tail -c 30000 build/reports/flutter-test.log
            echo '```'
            echo
            echo "_Automated diagnostic comment from the CI workflow; the same log is uploaded as the \`flutter-test-evidence\` artifact._"
          } > /tmp/pr-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md
      - name: Upload test log and LCOV
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flutter-test-evidence
          path: |
            build/reports/flutter-test.log
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  android-release:
    name: android-release / build-and-permission-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - name: Prepare CI config fixture (env.json for dart-define injection)
        shell: bash
        run: |
          umask 077
          cat > env.json <<'EOF'
          {
            "API_BASE_URL": "https://example.invalid"
          }
          EOF
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android release APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/reports
          set +e
          flutter build apk --release --dart-define-from-file=env.json --verbose 2>&1 | tee build/reports/android-release-build.log
          statuses=("${PIPESTATUS[@]}")
          status=${statuses[0]}
          set -e
          if (( status == 0 && statuses[1] != 0 )); then
            status=${statuses[1]}
          fi
          if (( status != 0 )); then
            bash tool/ci/annotate_failure.sh android build/reports/android-release-build.log
          fi
          exit "$status"
      - name: Verify final APK INTERNET permission
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump permissions "$APK" | tee build/reports/apk-permissions.txt
          grep -F "android.permission.INTERNET" build/reports/apk-permissions.txt
      - name: Check APK native library and ZIP 16 KiB alignment
        shell: bash
        run: |
          set -o pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          READELF="$(find "$ANDROID_HOME/ndk" -name llvm-readelf -path '*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf' | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -n "$READELF" && test -n "$ZIPALIGN"
          {
            echo "ELF checker: $READELF"
            python3 tool/ci/check_apk_16k.py "$APK" "$READELF" || exit $?
            echo "ZIP checker: $ZIPALIGN -c -P 16 -v 4 $APK"
            "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          } 2>&1 | tee build/reports/apk-16k-alignment.log || { bash tool/ci/annotate_failure.sh analyze build/reports/apk-16k-alignment.log; exit 1; }
      - name: Label non-distributable QA APK
        if: success()
        run: cp build/app/outputs/flutter-apk/app-release.apk build/reports/belog-QA-debug-signed.apk
      - name: Verify release signing guard and disposable signing fixture
        shell: bash
        run: |
          set +e
          bash -x tool/release/test_android_signing.sh > build/reports/signing-test.log 2>&1
          status=$?
          set -e
          if (( status != 0 )); then
            bash tool/ci/annotate_failure.sh analyze build/reports/signing-test.log
          fi
          exit "$status"
      - name: Upload Android build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-release-evidence
          path: |
            build/reports/android-release-build.log
            build/reports/apk-permissions.txt
            build/reports/apk-16k-alignment.log
            build/reports/signing-test.log
            build/reports/belog-QA-debug-signed.apk
          if-no-files-found: warn
          retention-days: 14