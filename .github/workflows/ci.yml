name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  agent-contract:
    name: agent-contract / guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate agent contract and workflow guardrails
        run: python3 tool/ci/validate_agent_contract.py
      - name: Check whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

  environment-contract:
    name: config-contract / no bundled secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify environment configuration contract
        run: python3 tool/ci/check_env_asset_contract.py

  format:
    name: format / dart-format
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - name: Report toolchain
        run: flutter --version
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .

  analyze:
    name: analyze / flutter-analyze
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - name: Prepare non-secret CI-only asset fixture
        shell: bash
        run: |
          umask 077
          printf 'SUPABASE_URL=https://example.invalid\nSUPABASE_KEY=ci-placeholder-not-a-secret\n' > .env
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run analyzer and preserve diagnostics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/reports
          flutter analyze --fatal-infos --machine 2>&1 | tee build/reports/flutter-analyze.log
      - name: Upload analyzer diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flutter-analyze-log
          path: build/reports/flutter-analyze.log
          if-no-files-found: warn
          retention-days: 14

  test:
    name: test / flutter-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - name: Prepare non-secret CI-only asset fixture
        shell: bash
        run: |
          umask 077
          printf 'SUPABASE_URL=https://example.invalid\nSUPABASE_KEY=ci-placeholder-not-a-secret\n' > .env
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run tests and collect coverage
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/reports
          flutter test --coverage --reporter expanded 2>&1 | tee build/reports/flutter-test.log
      - name: Upload test log and LCOV
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flutter-test-evidence
          path: |
            build/reports/flutter-test.log
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  android-release:
    name: android-release / build-and-permission-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - name: Prepare non-secret CI-only asset fixture
        shell: bash
        run: |
          umask 077
          printf 'SUPABASE_URL=https://example.invalid\nSUPABASE_KEY=ci-placeholder-not-a-secret\n' > .env
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android release APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/reports
          flutter build apk --release --verbose 2>&1 | tee build/reports/android-release-build.log
      - name: Verify final APK INTERNET permission
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump permissions "$APK" | tee build/reports/apk-permissions.txt
          grep -F "android.permission.INTERNET" build/reports/apk-permissions.txt
      - name: Upload Android build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-release-evidence
          path: |
            build/reports/android-release-build.log
            build/reports/apk-permissions.txt
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14
