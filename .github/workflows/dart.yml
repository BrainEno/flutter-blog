name: Manual Mobile Build Validation (No Publishing)

on:
  workflow_dispatch:
    inputs:
      include_ios:
        description: "Run the macOS unsigned iOS compile check as well"
        required: true
        type: boolean
        default: true
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: manual-mobile-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.8"
  BELOG_QA_BUILD: "true"

jobs:
  android:
    name: Android release compile check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - name: Prepare CI config fixture (env.json for dart-define injection)
        shell: bash
        run: |
          umask 077
          mkdir -p build/reports
          cat > env.json <<'EOF2'
          {
            "SUPABASE_URL": "https://example.invalid",
            "SUPABASE_KEY": "ci-placeholder-not-a-secret"
          }
          EOF2
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android release APK (validation only)
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --dart-define-from-file=env.json --verbose 2>&1 | tee build/reports/android-release-build.log
      - name: Label non-distributable QA APK
        if: success()
        run: cp build/app/outputs/flutter-apk/app-release.apk build/reports/belog-QA-debug-signed.apk
      - name: Upload Android validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-release-validation
          path: |
            build/reports/android-release-build.log
            build/reports/belog-QA-debug-signed.apk
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: iOS unsigned compile check (not distributable)
    if: ${{ inputs.include_ios }}
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true
      - name: Prepare CI config fixture (env.json for dart-define injection)
        shell: bash
        run: |
          umask 077
          mkdir -p build/reports
          cat > env.json <<'EOF2'
          {
            "SUPABASE_URL": "https://example.invalid",
            "SUPABASE_KEY": "ci-placeholder-not-a-secret"
          }
          EOF2
      - name: Resolve dependencies
        run: flutter pub get
      - name: Compile iOS without signing
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --dart-define-from-file=env.json --verbose 2>&1 | tee build/reports/ios-unsigned-build.log
      - name: Package compile output as an explicitly unsigned diagnostic artifact
        if: success()
        shell: bash
        run: |
          test -d build/ios/iphoneos/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/iphoneos/ios-unsigned-build-check.zip
      - name: Upload iOS validation evidence (not an IPA)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-unsigned-build-evidence
          path: |
            build/reports/ios-unsigned-build.log
            build/ios/iphoneos/ios-unsigned-build-check.zip
          if-no-files-found: warn
          retention-days: 14
