name: Dev checks (arena branch only)

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dev-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"
  BELOG_QA_BUILD: "true"

jobs:
  dev-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check formatting of changed Dart files
        id: fmt
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' dart_files < <(git diff --name-only -z --diff-filter=ACMR origin/main...HEAD -- '*.dart')
          echo "changed dart files: ${#dart_files[@]}"
          if (( ${#dart_files[@]} == 0 )); then
            echo "No Dart files changed."
            exit 0
          fi
          printf 'Formatting check: %s\n' "${dart_files[@]}"
          if dart format --output=none --set-exit-if-changed "${dart_files[@]}" 2>&1 | tee build-reports-format.txt; then
            echo "format=ok" >> "$GITHUB_OUTPUT"
          else
            echo "format=bad" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Auto-format and push a style commit
        if: failure() && steps.fmt.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' dart_files < <(git diff --name-only -z --diff-filter=ACMR origin/main...HEAD -- '*.dart')
          dart format "${dart_files[@]}"
          git config user.name "arena-dev-checks"
          git config user.email "actions@users.noreply.github.com"
          git add -- lib test
          git commit -m "style: canonical dart format (bot, run ${{ github.run_id }})"
          git push origin HEAD:"${{ github.ref_name }}"

      - name: Analyze
        if: always()
        shell: bash
        run: |
          set -o pipefail
          {
            echo "--- source snapshot: blog_event.dart ---"
            sed -n '1,12p' lib/features/blog/presentation/blocs/blog/blog_event.dart
            echo "--- source snapshot: retry_on_connection_closed.dart ---"
            sed -n '1,22p' lib/core/utils/retry_on_connection_closed.dart
          } | tee build-reports-sources.txt
          flutter analyze --fatal-infos 2>&1 | tee build-reports-analyze.txt

      - name: Test
        if: always()
        shell: bash
        run: |
          set -o pipefail
          flutter test --concurrency=1 --reporter expanded 2>&1 | tee build-reports-test.txt

      - name: Report results as a PR comment
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const read = (name, limit) => {
              try {
                const text = fs.readFileSync(name, 'utf8').trim();
                if (!text) return '(empty)';
                const lines = text.split('\n');
                return lines.length > limit
                  ? `(... ${lines.length - limit} lines omitted)\n` + lines.slice(-limit).join('\n')
                  : text;
              } catch (e) {
                return '(missing)';
              }
            };
            const body = [
              `### dev-checks report (run ${context.runId}, ${context.sha.slice(0, 7)})`,
              '',
              '#### debug context',
              '```',
              read('build-reports-debug.txt', 40),
              '```',
              '#### source snapshot (pre-analyze)',
              '```dart',
              read('build-reports-sources.txt', 40),
              '```',
              '#### dart format',
              '```',
              read('build-reports-format.txt', 60),
              '```',
              '#### flutter analyze --fatal-infos',
              '```',
              read('build-reports-analyze.txt', 120),
              '```',
              '#### flutter test (tail)',
              '```',
              read('build-reports-test.txt', 200),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 42,
              body: body.slice(0, 65000),
            });
