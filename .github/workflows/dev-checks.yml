name: Dev checks (arena branch only)

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dev-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  dev-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Reproduce the CI format gate exactly
        shell: bash
        run: |
          set -euo pipefail
          {
            dart --version
            flutter --version
            echo "origin/main -> $(git rev-parse origin/main)"
            echo "HEAD -> $(git rev-parse HEAD)"
          } | tee build-reports-versions.txt
          mapfile -d '' dart_files < <(git diff --name-only -z --diff-filter=ACMR origin/main...HEAD -- '*.dart')
          echo "changed dart files: ${#dart_files[@]}" | tee -a build-reports-versions.txt
          printf 'Formatting check: %s\n' "${dart_files[@]}" | tee -a build-reports-versions.txt
          if (( ${#dart_files[@]} == 0 )); then
            echo "No Dart files changed." | tee -a build-reports-versions.txt
            exit 0
          fi
          dart format --output=none "${dart_files[@]}" 2>&1 | tee build-reports-versions.txt.append || true
          cat build-reports-versions.txt.append >> build-reports-versions.txt || true
          dart format --output=none --set-exit-if-changed "${dart_files[@]}"

      - name: Report as a PR comment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let text = '(missing)';
            try { text = fs.readFileSync('build-reports-versions.txt', 'utf8'); } catch (e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 42,
              body: `### format-gate reproduction (run ${context.runId}, ${context.sha.slice(0, 7)})\n\`\`\`\n${text.slice(0, 60000)}\n\`\`\``,
            });
