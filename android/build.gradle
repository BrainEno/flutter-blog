allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    // Isar 3's Android library predates AGP's mandatory namespace setting.
    // Keep this compatibility workaround scoped to that plugin only.
    if (project.name == "isar_flutter_libs") {
        afterEvaluate {
            if (project.hasProperty("android") && project.android.namespace == null) {
                project.android.namespace = "dev.isar.isar_flutter_libs"
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
