plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Debug signing is only available through an explicit, non-distributable QA opt-in.
def qaBuild = System.getenv("BELOG_QA_BUILD") == "true"
def signingVars = ["ANDROID_KEYSTORE_PATH", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"]
def signingValues = signingVars.collectEntries { [(it): System.getenv(it)] }
def hasSigning = signingVars.every { signingValues[it]?.trim() }

android {
    namespace = "com.example.belog"
    compileSdk = 36
    ndkVersion = "27.2.12479018"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.belog"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // The Dart Isar reader is retained only for importing existing databases.
    // Prefer our source-built 16 KiB-compatible reader over the old plugin's
    // 4 KiB binaries; CI verifies both ELF alignment and exact APK contents.
    sourceSets.main.jniLibs.srcDir("$buildDir/generated/legacy-isar/jniLibs")
    packagingOptions.jniLibs.pickFirsts.add("**/libisar.so")

    signingConfigs {
        production {
            if (hasSigning) {
                storeFile = file(signingValues["ANDROID_KEYSTORE_PATH"])
                storePassword = signingValues["ANDROID_KEYSTORE_PASSWORD"]
                keyAlias = signingValues["ANDROID_KEY_ALIAS"]
                keyPassword = signingValues["ANDROID_KEY_PASSWORD"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = qaBuild ? signingConfigs.debug : signingConfigs.production
        }
    }
    
}

// Fail closed for release builds while leaving debug builds credential-free.
tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    doFirst {
        if (qaBuild && signingVars.any { signingValues[it]?.trim() }) {
            throw new GradleException("QA signing and production signing credentials cannot be combined.")
        }
        if (!qaBuild && !hasSigning) {
            throw new GradleException("Release signing credentials are required; set BELOG_QA_BUILD=true only for non-distributable QA builds.")
        }
        if (!qaBuild && signingValues["ANDROID_KEY_ALIAS"].equalsIgnoreCase("androiddebugkey")) {
            throw new GradleException("The Android debug key cannot be used for production signing.")
        }
    }
}

flutter {
    source = "../.."
}

// Android packaging must never silently fall back to the obsolete 4 KiB
// Isar binary. The shared task runs once before any variant merges native libs.
def legacyIsarOutput = file("$buildDir/generated/legacy-isar/jniLibs")
def buildLegacyIsar = tasks.register("buildLegacyIsar", Exec) {
    inputs.files(fileTree("../../tool/legacy_isar"))
    outputs.dir(legacyIsarOutput)
    commandLine "bash", "../../tool/legacy_isar/build_android.sh",
        "${android.sdkDirectory}/ndk/${android.ndkVersion}", legacyIsarOutput.absolutePath
}
tasks.configureEach { task ->
    if (task.name.matches("merge.*NativeLibs")) {
        task.dependsOn(buildLegacyIsar)
    }
}
